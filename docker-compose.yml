services:
  postgres:
    build:
      context: .
      dockerfile: db/Dockerfile
    container_name: multimodal-postgres
    environment:
      POSTGRES_DB: multimodal_diffusion
      POSTGRES_USER: multimodal
      POSTGRES_PASSWORD: multimodal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multimodal -d multimodal_diffusion"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: multimodal-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  inference-service:
    build:
      context: .
      dockerfile: inference_service/Dockerfile
    container_name: multimodal-inference
    environment:
      DATABASE_URL: postgresql://multimodal:multimodal@postgres:5432/multimodal_diffusion
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: multimodal-frontend
    ports:
      - "3000:3000"
    depends_on:
      - inference-service

  prometheus:
    build:
      context: .
      dockerfile: monitoring/Dockerfile
    container_name: multimodal-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    depends_on:
      - inference-service

volumes:
  postgres_data:
  prometheus_data:
  minio_data:
