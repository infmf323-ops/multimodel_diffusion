services:
  postgres:
    build:
      context: .
      dockerfile: db/Dockerfile
    container_name: multimodal-postgres
    environment:
      POSTGRES_DB: multimodal_diffusion
      POSTGRES_USER: multimodal
      POSTGRES_PASSWORD: multimodal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multimodal -d multimodal_diffusion"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: multimodal-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    # Образ minio/minio не содержит клиента `mc`; используем HTTP health (как в официальном Dockerfile MinIO).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  inference-service:
    build:
      context: .
      dockerfile: inference_service/Dockerfile
    container_name: multimodal-inference
    environment:
      DATABASE_URL: postgresql://multimodal:multimodal@postgres:5432/multimodal_diffusion
      DIFFUSION_BASE_MODEL: segmind/tiny-sd
      GENERATION_OUTPUT_DIR: /app/generated_outputs
      HF_HOME: /cache/huggingface
      DIFFUSION_DEVICE: auto
      OBJECT_STORAGE_ENABLED: "true"
      OBJECT_STORAGE_REQUIRED: "true"
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: synthetic-datasets
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PREFIX: online-generations
    # Раскомментируйте при NVIDIA + nvidia-container-toolkit (без GPU compose часто падает целиком):
    # gpus: all
    volumes:
      - hf_cache:/cache/huggingface
      - generation_outputs:/app/generated_outputs
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  generation-worker:
    build:
      context: .
      dockerfile: inference_service/Dockerfile
    container_name: multimodal-generation-worker
    command: ["python", "-m", "inference_service.app.generation_worker"]
    environment:
      DATABASE_URL: postgresql://multimodal:multimodal@postgres:5432/multimodal_diffusion
      DIFFUSION_BASE_MODEL: segmind/tiny-sd
      GENERATION_OUTPUT_DIR: /app/generated_outputs
      HF_HOME: /cache/huggingface
      DIFFUSION_DEVICE: auto
      GENERATION_WORKER_POLL_SECONDS: 2
      OBJECT_STORAGE_ENABLED: "true"
      OBJECT_STORAGE_REQUIRED: "true"
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: synthetic-datasets
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PREFIX: online-generations
    # gpus: all
    volumes:
      - hf_cache:/cache/huggingface
      - generation_outputs:/app/generated_outputs
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: multimodal-frontend
    ports:
      - "3000:3000"
    depends_on:
      inference-service:
        condition: service_healthy

  prometheus:
    build:
      context: .
      dockerfile: monitoring/Dockerfile
    container_name: multimodal-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    depends_on:
      - inference-service

  mlflow:
    build:
      context: .
      dockerfile: mlflow_service/Dockerfile
    container_name: multimodal-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow_artifacts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  prometheus_data:
  minio_data:
  mlflow_artifacts:
  hf_cache:
  generation_outputs:
